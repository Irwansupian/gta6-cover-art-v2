<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Panel Studio — GTA-style cover maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app">
  <aside class="panel">
    <header>
      <h1>Vice Panel Studio</h1>
      <p class="tag">Multi-panel, GTA-style cover art from your own photos.</p>
    </header>

    <section>
      <h2>Layout</h2>
      <div id="layouts" class="chips"></div>
    </section>

    <section>
      <h2>Colour grade</h2>
      <div id="grades" class="chips"></div>
    </section>

    <section>
      <h2>Words</h2>
      <label>Title <input id="title" type="text" maxlength="42" value="Sunset Heist"></label>
      <label>Script subtitle <input id="subtitle" type="text" maxlength="42" value="Neon Shores"></label>
      <label>Tagline <input id="tagline" type="text" maxlength="48" value="Every panel tells a story"></label>
    </section>

    <section>
      <h2>Photos</h2>
      <div id="tray" class="tray"></div>
      <label class="upload">Add a photo <input id="upload" type="file" accept="image/*"></label>
      <p class="hint">Pick a panel on the cover, then tap a photo to cast it there.</p>
    </section>

    <section>
      <h2>Selected panel</h2>
      <label>Zoom <input id="zoom" type="range" min="1" max="2.6" step="0.01" value="1"></label>
      <button id="center" type="button" class="ghost">Re-centre photo</button>
      <p class="hint">Drag the photo inside its panel to reframe it.</p>
    </section>

    <section>
      <h2>Print finish</h2>
      <label>Film grain <input id="grain" type="range" min="0" max="1" step="0.05" value="0.6"></label>
      <label>Vignette <input id="vignette" type="range" min="0" max="1" step="0.05" value="0.7"></label>
      <label class="check"><input id="halftone" type="checkbox"> Halftone dots</label>
    </section>

    <section>
      <h2>Export PNG</h2>
      <div class="exports">
        <button type="button" data-export="1080x1080">1080 × 1080</button>
        <button type="button" data-export="1080x1350">1080 × 1350</button>
        <button type="button" data-export="1920x1080">1920 × 1080</button>
      </div>
      <p id="status" role="status"></p>
    </section>
  </aside>

  <main class="stage">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover you are making"></canvas>
  </main>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
